<script>
'use strict';

/* =========================
   API（Twelve Data）
   ========================= */
const API = {
  base: 'https://api.twelvedata.com/time_series',
  symbol: 'USD/JPY',
  apikey: 'c480ad5f014e4298bd441ebe90452a2a'
};

/* =========================
   ルール（B：日足許可→4H押し目）
   ========================= */
const RULE = {
  d1: { emaFast: 50, emaSlow: 200, adxPeriod: 14, adxMin: 30 },
  h4: { emaShort: 20, emaMid: 50 }
};

// 取得本数
const OUTPUT = { d1: 260, h4: 220 };

/* =========================
   リスク/出口（おすすめ固定）
   - ATR(14)@4H をSL/トレールに採用
   ========================= */
const EXIT = {
  // 資金管理
  riskPct: 0.005,        // 0.5%/回（装置化の基本）
  minQtyStep: 100,       // SBI FX：100通貨単位
  pipSize: 0.01,         // USDJPY：1pip=0.01円

  // SLの材料
  swingLookback: 6,      // 直近6本(=24h)のH4スイング参照
  swingBufferPips: 6,    // スイングに足すバッファ（6pips）
  atrPeriod: 14,         // ATR(14)
  atrSLmult: 1.2,        // ★おすすめ：SL= max(スイング, ATR×1.2)

  // SL幅のガード
  minSLPips: 12,
  maxSLPips: 45,

  // TP1 + 保護
  tp1_R: 1.2,
  tp1_closePct: 0.50,
  bePlusPips: 2,         // TP1後 建値+2pipsへ

  // TP2（トレール）
  atrTrailMult: 1.0,     // ★おすすめ：トレール幅=ATR×1.0
  maxHoldBars: 3         // 12時間（H4×3）
};

/* =========================
   状態
   ========================= */
let creditsUsed = 0;
let last = { d1:null, h4:null, permission:{mode:'OFF',reason:[]}, price:null };

let nextH4CloseMs = null;

function $(id){ return document.getElementById(id); }

/* =========================
   余裕資産（手入力→端末保存）
   ========================= */
const BAL_KEY = 'fxpro_balance_jpy';

function loadBalance(){
  const saved = Number(localStorage.getItem(BAL_KEY));
  if (Number.isFinite(saved) && saved > 0) return saved;
  return 1000000;
}
function saveBalance(v){
  const n = Number(v);
  if (Number.isFinite(n) && n > 0) localStorage.setItem(BAL_KEY, String(Math.floor(n)));
}
function getBalance(){
  const el = $('balanceInput');
  const n = Number(el.value);
  if (Number.isFinite(n) && n > 0) return n;
  return loadBalance();
}

/* =========================
   UI helper
   ========================= */
function showMsg(msg, type='success'){
  const el = $('notification');
  el.className = 'notification';
  if(type==='warning') el.classList.add('warning');
  if(type==='error') el.classList.add('error');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(()=> el.style.display='none', 2200);
}
function setCredits(){ $('credits').textContent = `credits: ${creditsUsed}`; }

function formatTime(ts){
  const d = new Date(ts);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
}
function formatDateTime(ts){
  const d = new Date(ts);
  const Y = d.getFullYear();
  const M = String(d.getMonth()+1).padStart(2,'0');
  const D = String(d.getDate()).padStart(2,'0');
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${Y}-${M}-${D} ${hh}:${mm}`;
}
function setUpdateTime(){ $('updateTime').textContent = `更新: ${formatTime(Date.now())}`; }

/* =========================
   Time / Close detection
   - timezone=Asia/Tokyo指定で取得する前提
   - 確定足を「時刻」で判定（length-2依存排除）
   ========================= */
const DATA_TZ = 'Asia/Tokyo';

function intervalMs(interval){
  if (interval === '4h') return 4*60*60*1000;
  if (interval === '1day') return 24*60*60*1000;
  throw new Error('unsupported interval: ' + interval);
}

function parseTwelveDatetimeToMs(dt){
  if (!dt) throw new Error('datetime missing');

  if (/^\d{4}-\d{2}-\d{2}$/.test(dt)) {
    const [Y,M,D] = dt.split('-').map(Number);
    return new Date(Y, M-1, D, 0,0,0).getTime();
  }
  if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(dt)) {
    const [d,t] = dt.split(' ');
    const [Y,M,D] = d.split('-').map(Number);
    const [hh,mm,ss] = t.split(':').map(Number);
    return new Date(Y, M-1, D, hh,mm,ss).getTime();
  }

  const parsed = Date.parse(dt);
  if (Number.isFinite(parsed)) return parsed;

  if (typeof dt === 'number') return dt > 1e12 ? dt : dt * 1000;

  throw new Error('unknown datetime format: ' + dt);
}

function lastClosedIndex(arr, interval, safetyMs = 90*1000){
  if (!arr || arr.length === 0) return -1;

  const ms = intervalMs(interval);
  const now = Date.now();

  for (let i = arr.length - 1; i >= 0; i--) {
    const start = Number.isFinite(arr[i].ts) ? arr[i].ts : parseTwelveDatetimeToMs(arr[i].t);
    const closeTime = start + ms;
    if (closeTime <= now - safetyMs) return i;
  }
  return Math.max(0, arr.length - 2);
}

function setNextH4CloseFromData(h4){
  if (!h4 || h4.length === 0) { nextH4CloseMs = null; return; }
  const i = h4.length - 1;
  const start = Number.isFinite(h4[i].ts) ? h4[i].ts : parseTwelveDatetimeToMs(h4[i].t);
  nextH4CloseMs = Number.isFinite(start) ? (start + intervalMs('4h')) : null;
}

/* =========================
   OHLC Fetch（Twelve Data）
   ========================= */
async function fetchOHLC(interval, outputsize, force=false){
  const bust = force ? `&t=${Date.now()}` : '';
  const url =
    `${API.base}` +
    `?symbol=${encodeURIComponent(API.symbol)}` +
    `&interval=${encodeURIComponent(interval)}` +
    `&outputsize=${encodeURIComponent(String(outputsize))}` +
    `&timezone=${encodeURIComponent(DATA_TZ)}` +
    `&apikey=${encodeURIComponent(API.apikey)}` +
    bust;

  const res = await fetch(url, { method:'GET', cache:'no-cache' });
  creditsUsed += 1;
  setCredits();

  if(!res.ok) throw new Error(`HTTP ${res.status}`);
  const json = await res.json();

  if(json.status && json.status !== 'ok') throw new Error(json.message || 'API error');
  if(!json.values || !Array.isArray(json.values)) throw new Error('valuesなし');

  const asc = json.values.slice().reverse().map(v => {
    const t = v.datetime || v.date || v.time || v.timestamp;
    return ({
      t,
      ts: parseTwelveDatetimeToMs(t),
      o: Number(v.open),
      h: Number(v.high),
      l: Number(v.low),
      c: Number(v.close)
    });
  });

  if(asc.some(x => !Number.isFinite(x.c))) throw new Error('OHLC数値が不正');
  return asc;
}

/* =========================
   指標：EMA
   ========================= */
function ema(series, period){
  const k = 2 / (period + 1);
  const out = new Array(series.length).fill(null);
  if(series.length < period) return out;

  let sum = 0;
  for(let i=0;i<period;i++) sum += series[i];
  let prev = sum / period;
  out[period-1] = prev;

  for(let i=period;i<series.length;i++){
    const v = series[i];
    prev = (v - prev) * k + prev;
    out[i] = prev;
  }
  return out;
}

/* =========================
   指標：ADX (Wilder)
   ========================= */
function adx(ohlc, period=14){
  const n = ohlc.length;
  const tr = new Array(n).fill(null);
  const plusDM = new Array(n).fill(null);
  const minusDM = new Array(n).fill(null);

  for(let i=1;i<n;i++){
    const cur = ohlc[i], prev = ohlc[i-1];
    const upMove = cur.h - prev.h;
    const downMove = prev.l - cur.l;

    const tr1 = cur.h - cur.l;
    const tr2 = Math.abs(cur.h - prev.c);
    const tr3 = Math.abs(cur.l - prev.c);
    tr[i] = Math.max(tr1, tr2, tr3);

    plusDM[i]  = (upMove > downMove && upMove > 0) ? upMove : 0;
    minusDM[i] = (downMove > upMove && downMove > 0) ? downMove : 0;
  }

  function rma(arr, p){
    const out = new Array(arr.length).fill(null);
    let sum = 0;
    let count = 0;

    for(let i=0;i<arr.length;i++){
      const v = arr[i];
      if(v === null) continue;
      sum += v; count += 1;
      if(count === p){
        let prev = sum / p;
        out[i] = prev;
        for(let j=i+1;j<arr.length;j++){
          const x = arr[j];
          if(x === null) continue;
          prev = (prev * (p-1) + x) / p;
          out[j] = prev;
        }
        break;
      }
    }
    return out;
  }

  const trRMA = rma(tr, period);
  const pDMRMA = rma(plusDM, period);
  const mDMRMA = rma(minusDM, period);

  const pDI = new Array(n).fill(null);
  const mDI = new Array(n).fill(null);
  const dx = new Array(n).fill(null);

  for(let i=0;i<n;i++){
    if(trRMA[i] === null || trRMA[i] === 0) continue;
    pDI[i] = 100 * (pDMRMA[i] / trRMA[i]);
    mDI[i] = 100 * (mDMRMA[i] / trRMA[i]);
    const denom = pDI[i] + mDI[i];
    if(denom === 0) continue;
    dx[i] = 100 * (Math.abs(pDI[i] - mDI[i]) / denom);
  }

  const adxArr = rma(dx, period);
  return { adx: adxArr, pDI, mDI };
}

/* =========================
   指標：ATR (Wilder)
   ========================= */
function atr(ohlc, period=14){
  const n = ohlc.length;
  const tr = new Array(n).fill(null);

  for(let i=1;i<n;i++){
    const cur = ohlc[i], prev = ohlc[i-1];
    const tr1 = cur.h - cur.l;
    const tr2 = Math.abs(cur.h - prev.c);
    const tr3 = Math.abs(cur.l - prev.c);
    tr[i] = Math.max(tr1, tr2, tr3);
  }

  // Wilder RMA
  const out = new Array(n).fill(null);
  let sum = 0;
  let count = 0;
  for(let i=0;i<n;i++){
    const v = tr[i];
    if(v === null) continue;
    sum += v; count += 1;
    if(count === period){
      let prev = sum / period;
      out[i] = prev;
      for(let j=i+1;j<n;j++){
        const x = tr[j];
        if(x === null) continue;
        prev = (prev * (period-1) + x) / period;
        out[j] = prev;
      }
      break;
    }
  }
  return out;
}

/* =========================
   日足：許可判定（超安全①）
   ========================= */
function calcDailyPermission(d1){
  const closes = d1.map(x => x.c);
  const e50 = ema(closes, RULE.d1.emaFast);
  const e200 = ema(closes, RULE.d1.emaSlow);
  const adxObj = adx(d1, RULE.d1.adxPeriod);

  const i = lastClosedIndex(d1, '1day');
  const iPrev = i - 1;

  const close = closes[i];
  const ema50 = e50[i];
  const ema200 = e200[i];
  const ema200Prev = e200[iPrev];
  const adxNow = adxObj.adx[i];
  const adxPrev = adxObj.adx[iPrev];
  const closedAt = d1[i]?.ts;

  if(i < 1){
    return { mode:'OFF', reason:['データ不足（確定足が不足）'], snap:{close, ema50, ema200, adxNow, adxPrev, closedAt} };
  }
  if(ema50 === null || ema200 === null || adxNow === null || adxPrev === null){
    return { mode:'OFF', reason:['データ不足（EMA/ADX計算中）'], snap:{close, ema50, ema200, adxNow, adxPrev, closedAt} };
  }

  const buy = {
    cAbove200: close > ema200,
    e50Above200: ema50 > ema200,
    e200Up: ema200 > ema200Prev,
    adxMin: adxNow >= RULE.d1.adxMin,
    adxUp: adxNow > adxPrev
  };
  const sell = {
    cBelow200: close < ema200,
    e50Below200: ema50 < ema200,
    e200Down: ema200 < ema200Prev,
    adxMin: adxNow >= RULE.d1.adxMin,
    adxUp: adxNow > adxPrev
  };

  const buyOK = Object.values(buy).every(Boolean);
  const sellOK = Object.values(sell).every(Boolean);

  if(buyOK && !sellOK){
    return { mode:'BUY', reason:['D1: BUY許可ON（超安全①）'], snap:{close, ema50, ema200, ema200Prev, adxNow, adxPrev, buy, sell, closedAt} };
  }
  if(sellOK && !buyOK){
    return { mode:'SELL', reason:['D1: SELL許可ON（超安全①）'], snap:{close, ema50, ema200, ema200Prev, adxNow, adxPrev, buy, sell, closedAt} };
  }
  return { mode:'OFF', reason:['D1: OFF（条件未達）'], snap:{close, ema50, ema200, ema200Prev, adxNow, adxPrev, buy, sell, closedAt} };
}

/* =========================
   4H：押し目判定（1Hなし）
   ========================= */
function calcH4State(h4, permMode){
  if(permMode === 'OFF'){
    return { state:'OFF', msg:'日足がOFFのため、4H判定は停止', snap:null };
  }

  const closes = h4.map(x => x.c);
  const highs  = h4.map(x => x.h);
  const lows   = h4.map(x => x.l);

  const e20 = ema(closes, RULE.h4.emaShort);
  const e50 = ema(closes, RULE.h4.emaMid);

  const i = lastClosedIndex(h4, '4h');
  const prev = i - 1;

  if(i < 1){
    return { state:'WAIT', msg:'データ不足（確定足が不足）', snap:null };
  }

  const c = closes[i];
  const h = highs[i];
  const l = lows[i];
  const cPrev = closes[prev];
  const hPrev = highs[prev];
  const lPrev = lows[prev];

  const ema20 = e20[i];
  const ema50 = e50[i];
  const closedAt = h4[i]?.ts;

  if(ema20 === null || ema50 === null){
    return { state:'WAIT', msg:'データ不足（EMA計算中）', snap:{c, ema20, ema50, closedAt} };
  }

  const zoneLow = Math.min(ema20, ema50);
  const zoneHigh = Math.max(ema20, ema50);
  const touchedZone = (l <= zoneHigh && h >= zoneLow);

  if(permMode === 'BUY'){
    const confirm = (c > ema20) && (h > hPrev) && (c > cPrev);

    if(!touchedZone){
      return { state:'WAIT_PULLBACK', msg:'押し目待ち（EMA20-50ゾーン未接触）', snap:{c, ema20, ema50, zoneLow, zoneHigh, h, l, closedAt} };
    }
    if(touchedZone && !confirm){
      return { state:'WAIT_CONFIRM', msg:'押し目ゾーン接触 → 4H再開確認待ち（終値>EMA20 & 高値更新）', snap:{c, ema20, ema50, zoneLow, zoneHigh, h, hPrev, cPrev, closedAt} };
    }
    return { state:'ENTRY_OK', msg:'エントリー可（4H確定で再開確認済）', snap:{c, ema20, ema50, zoneLow, zoneHigh, h, hPrev, cPrev, closedAt} };
  }

  if(permMode === 'SELL'){
    const confirm = (c < ema20) && (l < lPrev) && (c < cPrev);

    if(!touchedZone){
      return { state:'WAIT_PULLBACK', msg:'戻り待ち（EMA20-50ゾーン未接触）', snap:{c, ema20, ema50, zoneLow, zoneHigh, h, l, closedAt} };
    }
    if(touchedZone && !confirm){
      return { state:'WAIT_CONFIRM', msg:'戻りゾーン接触 → 4H再開確認待ち（終値<EMA20 & 安値更新）', snap:{c, ema20, ema50, zoneLow, zoneHigh, l, lPrev, cPrev, closedAt} };
    }
    return { state:'ENTRY_OK', msg:'エントリー可（4H確定で再開確認済）', snap:{c, ema20, ema50, zoneLow, zoneHigh, l, lPrev, cPrev, closedAt} };
  }

  return { state:'OFF', msg:'不明な状態', snap:null };
}

/* =========================
   出口・数量提案（SBI FX: 100通貨丸め）
   - SL: max(スイング±バッファ, ATR×1.2) + min/maxガード
   - TP2: ATRトレール（TP1到達後の追随価格を表示）
   ========================= */
function roundDownToStep(qty, step){ return Math.floor(qty / step) * step; }

function calcQtyUSDJPY(balanceJPY, riskPct, slPips){
  if (!Number.isFinite(balanceJPY) || balanceJPY <= 0) return 0;
  if (!Number.isFinite(slPips) || slPips <= 0) return 0;

  const riskJPY = balanceJPY * riskPct;
  const lossPerPipJPY_perUnit = EXIT.pipSize; // 1通貨あたり 1pip=0.01円
  const lossAtSLJPY_perUnit = slPips * lossPerPipJPY_perUnit;
  const rawQty = Math.floor(riskJPY / lossAtSLJPY_perUnit);
  return Math.max(0, roundDownToStep(rawQty, EXIT.minQtyStep));
}

function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }

function calcTradePlan(h4, permMode, balanceJPY){
  if (permMode !== 'BUY' && permMode !== 'SELL') return null;

  const i = lastClosedIndex(h4, '4h');
  if (i < 1) return null;

  const entry = h4[i].c;

  // ATR(14)@4H（確定足）
  const atrArr = atr(h4, EXIT.atrPeriod);
  const atrNow = atrArr[i];
  if (!Number.isFinite(atrNow) || atrNow <= 0){
    return { ok:false, reason:'ATRが計算できません（データ不足）', entry };
  }

  const atrPips = atrNow / EXIT.pipSize; // 円→pips

  // スイング基準
  const from = Math.max(0, i - EXIT.swingLookback);
  const slice = h4.slice(from, i + 1);
  const swingLow = Math.min(...slice.map(x => x.l));
  const swingHigh = Math.max(...slice.map(x => x.h));

  // 1) スイングSL候補（±バッファ）
  const swingBuffer = EXIT.swingBufferPips * EXIT.pipSize;
  let slSwing, slSwingPips;
  if (permMode === 'BUY'){
    slSwing = swingLow - swingBuffer;
    slSwingPips = (entry - slSwing) / EXIT.pipSize;
  }else{
    slSwing = swingHigh + swingBuffer;
    slSwingPips = (slSwing - entry) / EXIT.pipSize;
  }

  // 2) ATR SL候補（ATR×1.2）
  const slAtrPips = atrPips * EXIT.atrSLmult;

  // 3) max(スイング, ATR) を採用
  let slPips = Math.max(slSwingPips, slAtrPips);

  // 4) ガード適用
  slPips = clamp(slPips, EXIT.minSLPips, EXIT.maxSLPips);

  // SL価格確定
  let sl;
  if (permMode === 'BUY') sl = entry - slPips * EXIT.pipSize;
  else sl = entry + slPips * EXIT.pipSize;

  // RR計算
  const R = slPips * EXIT.pipSize;
  const tp1 = (permMode === 'BUY') ? entry + EXIT.tp1_R * R : entry - EXIT.tp1_R * R;
  const be = (permMode === 'BUY') ? entry + EXIT.bePlusPips * EXIT.pipSize : entry - EXIT.bePlusPips * EXIT.pipSize;

  // 数量
  const qty = calcQtyUSDJPY(balanceJPY, EXIT.riskPct, slPips);
  const riskJPY = slPips * (qty * EXIT.pipSize);

  // TP2（トレール）用：追随幅（ATR×1.0）
  const trailPips = atrPips * EXIT.atrTrailMult;
  const trailWidth = trailPips * EXIT.pipSize; // 円

  // 追随ストップ（TP1到達後に使う想定：現在時点の“数値提案”として表示）
  // BUY: 直近N本の最高値 - trailWidth
  // SELL: 直近N本の最安値 + trailWidth
  const hiN = Math.max(...slice.map(x => x.h));
  const loN = Math.min(...slice.map(x => x.l));
  const trailStopNow = (permMode === 'BUY') ? (hiN - trailWidth) : (loN + trailWidth);

  // 「建値より悪化させない」ガード（TP1後を想定）
  const trailStopClamped = (permMode === 'BUY') ? Math.max(trailStopNow, be) : Math.min(trailStopNow, be);

  return {
    ok: true,
    permMode,
    entry,
    sl,
    slPips: Math.round(slPips),
    tp1,
    be,
    qty,
    riskJPY: Math.round(riskJPY),
    atrNow,
    atrPips: Number(atrPips.toFixed(1)),
    slSwingPips: Number(slSwingPips.toFixed(1)),
    slAtrPips: Number(slAtrPips.toFixed(1)),
    trailPips: Number(trailPips.toFixed(1)),
    trailStopNow: trailStopClamped,
    maxHoldHours: EXIT.maxHoldBars * 4,
    sliceHi: hiN,
    sliceLo: loN
  };
}

function setEnvUI(){
  const https = location.protocol === 'https:';
  const envBadge = $('envBadge');
  const envAlert = $('envAlert');

  if(https){
    envBadge.className = 'badge ok';
    envBadge.textContent = 'HTTPS';
    envAlert.style.display = 'block';
    envAlert.className = 'alert-box ok';
    envAlert.innerHTML =
      "<div class='alert-title'>✅ HTTPS環境</div>" +
      "<div class='alert-text'>USDJPY固定。D1許可（EMA+ADX）→ H4押し目（EMA20-50）→ 出口はATR適応（SL/TP2）。</div>";
  }else{
    envBadge.className = 'badge ng';

}

function renderPrice(nowClose, prevClose){
  const priceEl = $('currentPrice');
  const changeEl = $('priceChange');

  priceEl.textContent = nowClose.toFixed(3);

  const diff = nowClose - prevClose;
  const pct = (diff / prevClose) * 100;
  const pctStr = Math.abs(pct).toFixed(2);

  if(diff >= 0){
    priceEl.className = 'price';
    changeEl.className = 'change';
    changeEl.textContent = `▲ ${pctStr}%`;
  }else{
    priceEl.className = 'price down';
    changeEl.className = 'change down';
    changeEl.textContent = `▼ ${pctStr}%`;
  }
}

function renderDaily(permission){
  const card = $('dailyCard');
  const permBadge = $('permBadge');

  const s = permission.snap || {};
  const adxNow = Number.isFinite(s.adxNow) ? s.adxNow.toFixed(1) : '--';
  const adxPrev = Number.isFinite(s.adxPrev) ? s.adxPrev.toFixed(1) : '--';
  const ema50 = Number.isFinite(s.ema50) ? s.ema50.toFixed(3) : '--';
  const ema200 = Number.isFinite(s.ema200) ? s.ema200.toFixed(3) : '--';
  const close = Number.isFinite(s.close) ? s.close.toFixed(3) : '--';
  const closedAtStr = Number.isFinite(s.closedAt) ? formatDateTime(s.closedAt) : '--';

  let cls = 'card';
  let badgeCls = 'badge';
  let label = '許可: OFF';

  if(permission.mode === 'BUY'){
    cls += ' ok'; badgeCls += ' ok'; label = '許可: BUY ON';
  }else if(permission.mode === 'SELL'){
    cls += ' ok'; badgeCls += ' ok'; label = '許可: SELL ON';
  }else{
    cls += ' warn'; badgeCls += ' warn'; label = '許可: OFF';
  }

  permBadge.className = badgeCls;
  permBadge.textContent = label;

  const buy = s.buy || {};
  const sell = s.sell || {};
  const checkLine = (name, ok) => `${ok ? '✅' : '❌'} ${name}`;

  const checks = (permission.mode === 'SELL')
    ? [
        checkLine('Close < EMA200', !!sell.cBelow200),
        checkLine('EMA50 < EMA200', !!sell.e50Below200),
        checkLine('EMA200 下降（傾き）', !!sell.e200Down),
        checkLine(`ADX>=${RULE.d1.adxMin}`, !!sell.adxMin),
        checkLine('ADX 上向き', !!sell.adxUp)
      ]
    : [
        checkLine('Close > EMA200', !!buy.cAbove200),
        checkLine('EMA50 > EMA200', !!buy.e50Above200),
        checkLine('EMA200 上昇（傾き）', !!buy.e200Up),
        checkLine(`ADX>=${RULE.d1.adxMin}`, !!buy.adxMin),
        checkLine('ADX 上向き', !!buy.adxUp)
      ];

  card.className = cls;
  card.innerHTML = `
    <div style="font-weight:900;font-size:14px;">${label}</div>
    <div style="margin-top:6px;color:#cbd5e1;font-size:12px;line-height:1.7;">
      ${checks.join('<br>')}
    </div>
    <div class="note">確定足時刻（D1）: <b>${closedAtStr}</b></div>
    <div class="kv">
      <div><div class="k">Close（確定足）</div><div class="v">${close}</div></div>
      <div><div class="k">ADX(14)（確定足）</div><div class="v">${adxNow} <span style="color:#94a3b8;font-weight:800;">(prev ${adxPrev})</span></div></div>
      <div><div class="k">EMA50</div><div class="v">${ema50}</div></div>
      <div><div class="k">EMA200</div><div class="v">${ema200}</div></div>
    </div>
  `;
}

function renderH4(h4State, permMode, plan, balanceJPY){
  const card = $('h4Card');

  let cls = 'card';
  if(h4State.state === 'ENTRY_OK') cls += ' ok';
  else if(h4State.state === 'WAIT_CONFIRM') cls += ' warn';
  else if(h4State.state === 'WAIT_PULLBACK') cls += ' warn';
  else cls += ' ng';

  const s = h4State.snap || {};
  const c = Number.isFinite(s.c) ? s.c.toFixed(3) : '--';
  const ema20 = Number.isFinite(s.ema20) ? s.ema20.toFixed(3) : '--';
  const ema50 = Number.isFinite(s.ema50) ? s.ema50.toFixed(3) : '--';
  const zL = Number.isFinite(s.zoneLow) ? s.zoneLow.toFixed(3) : '--';
  const zH = Number.isFinite(s.zoneHigh) ? s.zoneHigh.toFixed(3) : '--';
  const closedAtStr = Number.isFinite(s.closedAt) ? formatDateTime(s.closedAt) : '--';

  const dir = permMode === 'BUY' ? '買い' : (permMode === 'SELL' ? '売り' : '--');

  let planHtml = '';
  const refTag = (h4State.state === 'ENTRY_OK') ? '（ENTRY_OKなので実行候補）' : '（参考：ENTRY_OK時にこの設計で実行）';

  if (!plan) {
    planHtml = `<div class="note">出口提案: --（日足OFF or データ不足）</div>`;
  } else if (!plan.ok) {
    planHtml = `<div class="note">出口提案: <b>見送り</b><br>${plan.reason || ''}</div>`;
  } else {
    const qtyStr = plan.qty.toLocaleString('ja-JP');
    const riskStr = plan.riskJPY.toLocaleString('ja-JP');

    planHtml = `
      <div class="note">
        <b>出口提案 ${refTag}</b><br>
        余裕資産: ${Math.floor(balanceJPY).toLocaleString('ja-JP')}円 / 1回リスク: ${(EXIT.riskPct*100).toFixed(2)}%<br>
        <br>
        <b>SL（ATR適応）</b><br>
        ・ATR(14)@4H: ${plan.atrPips}pips（≈${plan.atrNow.toFixed(4)}円）<br>
        ・SL候補：スイング ${plan.slSwingPips}pips / ATR×${EXIT.atrSLmult} = ${plan.slAtrPips}pips<br>
        ・採用SL幅：<b>${plan.slPips}pips</b>（min ${EXIT.minSLPips} / max ${EXIT.maxSLPips}）<br>
        <br>
        Entry: ${plan.entry.toFixed(3)} / SL: ${plan.sl.toFixed(3)}（${plan.slPips}pips）<br>
        TP1: ${plan.tp1.toFixed(3)}（${EXIT.tp1_R}R / ${Math.round(EXIT.tp1_closePct*100)}%利確）<br>
        TP1後: SL→建値 ${plan.be.toFixed(3)}（±${EXIT.bePlusPips}pips）<br>
        <br>
        <b>TP2（ATRトレール）</b><br>
        ・トレール幅：ATR×${EXIT.atrTrailMult} = ${plan.trailPips}pips<br>
        ・追随ストップ（提案値）: <b>${plan.trailStopNow.toFixed(3)}</b>（TP1後、建値より悪化しない）<br>
        ・最大保有：${plan.maxHoldHours}h（目安）<br>
        <br>
        推奨数量（SBI FX）: <b>${qtyStr}通貨</b>（100通貨単位・切り下げ）<br>
        想定最大損失: 約<b>${riskStr}円</b>
      </div>
    `;
  }

  card.className = cls;
  card.innerHTML = `
    <div style="font-weight:900;font-size:14px;">
      方向: ${dir} / 状態: ${h4State.state}
    </div>
    <div style="margin-top:6px;color:#cbd5e1;font-size:12px;line-height:1.7;">
      ${h4State.msg}
    </div>

    <div class="note">確定足時刻（4H）: <b>${closedAtStr}</b></div>

    <div class="kv">
      <div><div class="k">Close（確定足）</div><div class="v">${c}</div></div>
      <div><div class="k">押し目ゾーン（EMA20-50）</div><div class="v">${zL} 〜 ${zH}</div></div>
      <div><div class="k">EMA20</div><div class="v">${ema20}</div></div>
      <div><div class="k">EMA50</div><div class="v">${ema50}</div></div>
    </div>

    ${planHtml}
  `;
}

/* =========================
   4H確定タイマー（データ時刻基準）
   ========================= */
function updateTimer(){
  const el = $('nextUpdate');
  if(!el) return;

  if (!nextH4CloseMs) {
    el.textContent = '⏰ 次の4H確定まで --:--';
    return;
  }

  const now = Date.now();
  const diff = Math.max(0, nextH4CloseMs - now);

  const hh = Math.floor(diff / (1000*60*60));
  const mm = Math.floor((diff % (1000*60*60)) / (1000*60));

  el.textContent = `⏰ 次の4H確定まで ${hh}:${String(mm).padStart(2,'0')}`;
}

/* =========================
   メイン更新（D1 + H4）
   ========================= */
async function runUpdate(force){
  try{
    setEnvUI();
    if(location.protocol !== 'https:'){
      showMsg('file://では取得できません（HTTPSで）', 'error');
      return;
    }

    // 余裕資産 保存
    const bi = $('balanceInput');
    if (bi && bi.value) saveBalance(bi.value);
    const balanceJPY = getBalance();

    $('apiBadge').className = 'badge warn';
    $('apiBadge').textContent = force ? '強制取得中...' : '取得中...';

    // 1) 日足 → 許可判定
    const d1 = await fetchOHLC('1day', OUTPUT.d1, force);
    last.d1 = d1;

    const perm = calcDailyPermission(d1);
    last.permission = perm;

    const i = lastClosedIndex(d1, '1day');
    const iPrev = i - 1;

    const nowClose = d1[i].c;
    const prevClose = d1[iPrev].c;
    last.price = nowClose;

    renderPrice(nowClose, prevClose);
    renderDaily(perm);

    // 2) 4H
    const h4 = await fetchOHLC('4h', OUTPUT.h4, force);
    last.h4 = h4;

    setNextH4CloseFromData(h4);
    updateTimer();

    const h4State = calcH4State(h4, perm.mode);
    const plan = (perm.mode === 'BUY' || perm.mode === 'SELL') ? calcTradePlan(h4, perm.mode, balanceJPY) : null;

    renderH4(h4State, perm.mode, plan, balanceJPY);

    $('apiBadge').className = 'badge ok';
    $('apiBadge').textContent = 'OHLC取得OK';

    setUpdateTime();
    showMsg(force ? '✅ 強制更新完了' : '✅ 更新完了');
  }catch(e){
    console.error(e);
    $('apiBadge').className = 'badge ng';
    $('apiBadge').textContent = '取得失敗';
    showMsg(`⚠️ ${e.message}`, 'error');
  }
}
